name: Build GMailGPU APK

concurrency:
  group: gmailgpu-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $ANDROID_SDK_ROOT/cmdline-tools"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure stable update signing key (optional)
        shell: bash
        env:
          GMAILGPU_KEYSTORE_BASE64: ${{ secrets.GMAILGPU_KEYSTORE_BASE64 }}
          GMAILGPU_KEYSTORE_PASSWORD: ${{ secrets.GMAILGPU_KEYSTORE_PASSWORD }}
          GMAILGPU_KEY_ALIAS: ${{ secrets.GMAILGPU_KEY_ALIAS }}
          GMAILGPU_KEY_PASSWORD: ${{ secrets.GMAILGPU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${GMAILGPU_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$GMAILGPU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gmailgpu-signing.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/gmailgpu-signing.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$GMAILGPU_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$GMAILGPU_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$GMAILGPU_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable APK signing key configured."
          else
            echo "::warning::Stable signing secrets are not configured. This build will use the runner's temporary debug key, and in-place updates across builds may fail."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK integrity, package metadata, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          test -s "$APK"
          echo "APK size: $(stat -c '%s bytes' "$APK")"
          echo "Checking ZIP/APK structure..."
          unzip -t "$APK"
          echo "Checking APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Checking package name and version..."
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.g57.issuehub' versionCode='18' versionName='0.3.3-beta'" apk-badging.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          {
            echo "### Verified GMailGPU APK"
            echo "- Version: 0.3.3-beta (18)"
            echo "- APK size: $(stat -c '%s bytes' "$APK")"
            echo "- APK signature: passed"
            echo "- SHA-256: `$SHA256`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: GMailGPU-v0.3.3-beta
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 90
